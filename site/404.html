<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Không Tìm Thấy Trang – Thôn Hòa Phú</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        .error-container {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: var(--space-lg);
        }
        .error-code {
            font-size: 6rem;
            color: var(--gold-muted);
            line-height: 1;
            margin-bottom: var(--space-xs);
            font-family: var(--font-heading);
            font-weight: 700;
        }
        .error-message {
            font-size: 1.25rem;
            margin-bottom: var(--space-lg);
        }
    </style>
</head>
<body>
    <header class="top-header">
        <div class="logo-text">Thôn Hòa Phú</div>
    </header>

    <main class="error-container container">
        <div class="error-code">404</div>
        <h2>Không Tìm Thấy Trang</h2>
        <p class="error-message">Xin lỗi, trang bạn đang tìm kiếm không tồn tại hoặc đã được di chuyển.</p>
        <a href="index.html" class="btn btn-primary">Quay lại trang chủ</a>
    </main>

    <footer class="main-footer text-center" style="position: fixed; bottom: 0; left: 0; width: 100%;">
        <p>© 2026 Thôn Hòa Phú - Mạch Nguồn Truyền Thống.</p>
    </footer>
</body>
</html>
